<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verso Chat</title>
  <style>
    :root {
      color-scheme: light;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
      color: rgba(0, 0, 0, 0.85);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    body::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
    #chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      min-height: 100%;
      box-sizing: border-box;
    }

    /* Message layout */
    .message {
      max-width: 100%;
    }
    .message-user {
      display: flex;
      justify-content: flex-end;
    }
    .message-assistant {
      display: block;
    }

    /* User bubble */
    .message-user .message-content {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 10px;
      padding: 10px;
      max-width: 240px;
      word-wrap: break-word;
      line-height: 1.5;
    }

    /* Assistant content */
    .message-assistant .message-content {
      padding: 10px;
      max-width: 100%;
      line-height: 1.55;
    }

    /* Markdown content styles */
    .message-content p {
      margin: 0 0 0.6em;
    }
    .message-content p:last-child {
      margin-bottom: 0;
    }
    .message-content h1 {
      font-size: 16px;
      margin: 0.8em 0 0.4em;
    }
    .message-content h2 {
      font-size: 14px;
      margin: 0.6em 0 0.3em;
    }
    .message-content h3 {
      font-size: 13px;
      margin: 0.5em 0 0.3em;
    }
    .message-content ul, .message-content ol {
      margin: 0 0 0.6em;
      padding-left: 1.5em;
    }
    .message-content li {
      margin-bottom: 0.25em;
      line-height: 1.55;
    }
    .message-content li:last-child {
      margin-bottom: 0;
    }
    .message-content li > ul, .message-content li > ol {
      margin-top: 0.25em;
      margin-bottom: 0.25em;
      padding-left: 1.5em;
    }
    .message-content li > p {
      margin-bottom: 0.3em;
    }
    .message-content li > p:last-child {
      margin-bottom: 0;
    }
    .message-content code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 11px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 3px;
      padding: 1px 4px;
    }
    .message-content pre {
      margin: 0 0 0.6em;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.04);
      border-radius: 6px;
      overflow-x: auto;
    }
    .message-content pre code {
      background: none;
      padding: 0;
      font-size: 11px;
    }
    .message-content blockquote {
      margin: 0 0 0.6em;
      padding-left: 12px;
      border-left: 2px solid rgba(0, 0, 0, 0.15);
      color: rgba(0, 0, 0, 0.65);
    }
    .message-content strong {
      font-weight: 600;
    }
    .message-content a {
      color: rgba(0, 122, 255, 1);
      text-decoration: none;
    }
    .message-content a:hover {
      text-decoration: underline;
    }
    .message-content .streaming-tail {
      white-space: pre-wrap;
    }

    /* Collapsible selection chip inside user bubble */
    .selection-chip {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 6px;
      padding: 4px 8px;
      margin-bottom: 6px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .selection-chip-label {
      font-size: 10px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.4);
    }
    .selection-chip-body {
      display: none;
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.45;
      color: rgba(0, 0, 0, 0.55);
      font-style: italic;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .selection-chip.expanded .selection-chip-body {
      display: block;
    }

    /* Pinned message styling */
    .message-pinned {
      border-left: 2px solid rgba(0, 122, 255, 0.4);
      padding-left: 10px;
    }
    .message-pinned .message-content {
      padding-left: 0;
    }
    .message-pinned.message-user {
      justify-content: flex-start;
    }
    .message-pinned.message-user .message-content {
      background: rgba(0, 0, 0, 0.04);
      border-radius: 8px;
      padding: 6px 10px;
      max-width: 100%;
      color: rgba(0, 0, 0, 0.55);
    }
    .pin-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.4);
      margin-bottom: 4px;
    }
    .pin-badge-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(0, 122, 255, 1);
    }
    .pin-badge-dismiss {
      margin-left: auto;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.35);
      padding: 0 4px;
      line-height: 1;
    }
    .pin-badge-dismiss:hover {
      color: rgba(0, 0, 0, 0.6);
    }

    /* Pin button */
    .pin-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.3);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: color 0.15s ease;
    }
    .pin-btn:hover {
      color: rgba(0, 122, 255, 0.8);
    }

    /* Activity indicator — unified dots / tool status in same spot */
    .activity-inner {
      padding: 10px;
    }
    .thinking-dots {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 16px;
    }
    .thinking-dots .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.2);
      animation: thinking 1.4s ease-in-out infinite;
    }
    .thinking-dots .dot:nth-child(2) { animation-delay: 0.2s; }
    .thinking-dots .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes thinking {
      0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
      40% { opacity: 0.8; transform: scale(1.1); }
    }
    .tool-status-text {
      display: flex;
      align-items: center;
      height: 16px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.22);
      font-style: italic;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(0, 0, 0, 0.4);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="chat-container"></div>
  <script src="chat.bundle.js"></script>
  <script>
    if (window.VersoChatInit) {
      window.VersoChatInit();
    }
  </script>
</body>
</html>
